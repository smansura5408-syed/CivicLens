
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicLens - Report Submitted</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-box {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 45px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px #00000012;
        }

        .check {
            width: 75px;
            height: 75px;
            background: #d9f8f1;
            color: #16a085;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin: 0 auto 25px;
        }

        h1 {
            color: #102c4e;
            font-size: 26px;
            margin-bottom: 15px;
        }

        p {
            color: #667085;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .status {
            background: #fff7df;
            color: #a66a00;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin: 25px 0;
        }

        .btn {
            display: inline-block;
            background: #102c4e;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn:hover {
            background: #176b87;
        }
    </style>
</head>

<body>

<div class="success-box">

    <div class="check">✓</div>

    <h1>Report Submitted Successfully!</h1>

    <p>
        Thank you for helping make your city better.
        Your complaint has been saved in CivicLens.
    </p>

    <div class="status">
        Status: Pending
    </div>

    <a href="/" class="btn">Back to Home</a>

</div>

</body>
</html>
